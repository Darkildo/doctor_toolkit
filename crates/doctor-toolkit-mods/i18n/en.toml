Middle drag — pan
Left drag in empty space — forward, back and turn (Select: frame)
Alt + left drag — orbit the selection
Alt + right drag — towards the selection and back
Q W E R — select, move, rotate, scale
Space — next gizmo mode
Ctrl — snap (free while snapping is on)
Alt + drag of the gizmo — move copies
Click, Ctrl + click, Shift + click — select, toggle, add
Shift / Ctrl + drag — add to / take from the selection
F — fly to the selection
End — put the selection on the ground
Ctrl+A, Esc — select everything shown, nothing
Ctrl+D, Del — duplicate, delete
Right click — context menu"""
