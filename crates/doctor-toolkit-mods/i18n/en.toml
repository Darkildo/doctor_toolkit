# English interface strings: the default and the fallback of every language.
#
# A key is `<table>.<name>`; code asks for it with tr("table.name"), or with
# trf("table.name", &[("x", &value)]) when the text has {x} placeholders.
# A translation (ru.toml) has the same tables and keys; missing keys fall
# back to this file. Keep "…" for actions that ask something before acting.
#
# Text with a number is a plural: an inline table of forms, asked for with
# trn("table.name", n, &[...]); {n} is the number. English has the forms
# `one` and `other`, Russian `one` (1, 21), `few` (2–4, 22–24) and `many`
# (0, 5–20, 25). A text with several numbers puts plurals of [count] into
# placeholders: trf("x.counts", &[("files", &trn("count.files", n, &[]))]).

