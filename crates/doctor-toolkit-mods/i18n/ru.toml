# Русский перевод интерфейса: те же таблицы и ключи, что в en.toml.
#
# Термины — как в руководстве (docs/guide): мод, поток, ресурс, рабочее
# пространство, мастер, «Играть». Имена форматов, типов ресурсов, классов
# игры и пути не переводятся. Множественное число — встроенная таблица форм
# one (1, 21, 101), few (2–4, 22–24), many (0, 5–20, 25–30); {n} — число.

