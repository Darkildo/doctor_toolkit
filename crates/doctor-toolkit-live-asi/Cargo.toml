[package]
name = "doctor-toolkit-live-asi"
description = "In-game module of the live link: a DLL for the ASI loader of The Godfather II (PC 1.0.789.0)"
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-only"
publish = false

# A Windows DLL for 32-bit x86, outside the workspace (the workspace builds
# for the host). Build: tools/build-live-module.sh, or
#   cargo build --release --target i686-pc-windows-gnu \
#       --manifest-path crates/doctor-toolkit-live-asi/Cargo.toml
[workspace]

[lib]
name = "doctor_live"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
doctor-toolkit-live = { path = "../doctor-toolkit-live" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
# Unwinding stays on: every entry from the game (DllMain, the frame hook,
# the threads) catches panics, none crosses into the game's code.
panic = "unwind"
strip = true
debug = false
