[package]
name = "doctor-toolkit-mcp"
description = "Model Context Protocol server of doctor-toolkit: AI clients read the game through the toolkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
doctor-toolkit.workspace = true
rmcp = { version = "=3.8.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync"] }

[dev-dependencies]
doctor-toolkit = { workspace = true, features = ["testing"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time"] }
