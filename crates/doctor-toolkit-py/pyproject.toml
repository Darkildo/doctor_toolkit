[build-system]
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

[project]
name = "doctor-toolkit"
description = "Read, convert and edit the game files of the EARS engine (The Godfather II PC) from Python"
readme = "README.md"
license = { text = "GPL-3.0-only" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Typing :: Typed",
]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Repository = "https://github.com/Darkildo/doctor_toolkit"

[tool.maturin]
# Mixed project: the Rust extension is `doctor_toolkit._native`, the package
# `python/doctor_toolkit` re-exports it and carries the type stubs.
python-source = "python"
module-name = "doctor_toolkit._native"

[tool.pytest.ini_options]
testpaths = ["tests"]
