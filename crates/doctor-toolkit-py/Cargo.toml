[package]
name = "doctor-toolkit-py"
description = "Python bindings of doctor-toolkit: the module `doctor_toolkit`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "doctor_toolkit_py"
crate-type = ["cdylib"]
# An extension module is linked against the interpreter that loads it, so a
# Rust test harness could not link without libpython. The tests are written in
# Python (`tests/`, pytest).
test = false
doctest = false

[dependencies]
doctor-toolkit.workspace = true
pyo3 = { version = "0.29.3", features = ["abi3-py39"] }
pythonize = "0.29.0"
serde = "1"
serde_json = "1"

[build-dependencies]
pyo3-build-config = "0.29.3"
