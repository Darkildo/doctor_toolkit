[package]
name = "doctor-toolkit"
description = "Reader and writer for the game file formats of the EARS engine (EA Redwood Shores / Visceral Games)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
doctor-toolkit-live.workspace = true
binrw.workspace = true
memmap2.workspace = true
rayon.workspace = true
thiserror.workspace = true
png = "0.18"
texpresso = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
toml = "1"
sha2 = "0.10"
gltf = { version = "1.4", default-features = false, features = ["utils", "names"] }
jpeg-decoder = { version = "0.3", default-features = false }
flate2 = "1"
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
notify = "8.2"
schemars = { version = "1", optional = true }
rapier3d = { version = "=0.36.1", optional = true }

[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "1"
flate2 = "1"

[features]
# A miniature game for the tests of the GUI and other crates (`testing`).
testing = []
# JSON Schema of the parameter structures of operations (the MCP server
# builds its tool descriptions from it).
schema = ["dep:schemars"]
# The collision of a level as a physics world: rays onto the ground and the
# walk of a player (`level::walk`), for the editor and the MCP server.
walk = ["dep:rapier3d"]

[dev-dependencies]
# The ABI of native mods: a test compares it with the one the mod manager installs.
doctor-toolkit-sdk = { path = "../doctor-toolkit-sdk" }
proptest = "1"
refpack = "5"
tempfile = "3"
