[[cap]]
id = "shell.bridge"
area = "shell"
title = "Мост агента к открытому окну: что выделил человек, показать ему ресурс или объект"
[cap.mcp]
use = ["editor_selection", "editor_open", "editor_show_object"]
[cap.editor]
never = "для человека это и есть выделение и переход в окне; редактор только отвечает на мост (и спрашивает, прежде чем одолжить рабочее пространство)"

[[cap]]
id = "shell.mcp-server"
area = "shell"
title = "Запустить MCP-сервер для клиента ИИ"
[cap.cli]
use = ["mcp"]
[cap.mcp]
never = "сервер запускает клиент ИИ"
[cap.editor]
never = "сервер запускает клиент ИИ, а не окно; окно отвечает ему через мост"

[[cap]]
id = "shell.generated"
area = "shell"
title = "Служебное для разработчиков тулкита: генерация и проверка базы знаний, типов данных и этой таблицы"
[cap.cli]
use = ["kb-gen", "kb-lint", "types-gen", "parity-gen"]
[cap.mcp]
never = "команды работают с рабочей копией репозитория тулкита, а не с игрой"
[cap.editor]
never = "то же"

[[cap]]
id = "shell.selftest"
area = "shell"
title = "Служебные проверки: кодек анимаций туда-обратно, ответчик вместо игры, падение игры нарочно"
[cap.cli]
use = ["anim encode-test", "live fake", "crash-report test"]
[cap.mcp]
never = "проверки самого тулкита для его разработчиков"
[cap.editor]
never = "то же"
