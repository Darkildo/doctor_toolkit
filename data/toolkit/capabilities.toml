at = "unpack пишет в папку вывода сервера (--output-dir); pack — одна операция"
[cap.editor]
use = ["cmd.unpack", "cmd.pack"]
input = "menu"
[cap.cli]
use = ["unpack", "pack"]
[cap.python]
use = ["Game.unpack", "Game.pack"]

[[cap]]
id = "res.import-file"
area = "resources"
title = "Вернуть отредактированный экспорт: JSON строк, логики, графа, диалога, исходник Lua, сырые данные"
[cap.mcp]
use = ["import_file"]
[cap.editor]
at = "меню Asset ресурса (вкладка, контекстное меню вкладки, Details): «Replace with a file…» — разбор по типу, как import_file (JSON строк, логики, графа навигации, диалога, исходник или байт-код Lua), и «Replace with raw data…»; кроме того Import JSON в просмотрщиках, Load… у Lua, Save у таблицы строк"
input = "menu+form"
preset = "RESOURCE=import=<файл> | raw=<файл>"
[cap.cli]
use = ["text-import", "logic-import", "graph-import", "dialogue-import", "lua-import"]
[cap.python]
use = ["Workspace.set_data", "Workspace.set_many", "Workspace.set_string_table"]

[[cap]]
id = "res.add-raw"
area = "resources"
title = "Добавить в поток новый ресурс из файла сырых данных"
[cap.mcp]
use = ["add_resource"]
[cap.editor]
use = ["cmd.add_resource"]
at = "окно «New zone: streams and resources», форма Add resource; Content Browser → контекстное меню потока → Add a resource from a file here…"
input = "menu+form"
preset = "ZONE=resource:stream=,type=,file=[,ids=][,policy=][,compress]"
[cap.cli]
use = ["add-resource"]

[[cap]]
id = "res.clone"
area = "resources"
title = "Клонировать ресурсы под новыми id: в тот же или другой поток, с перенацеливанием ссылок"
[cap.mcp]
use = ["clone_resource"]
[cap.editor]
use = ["cmd.clone_resources"]
at = "форма Clone resources: несколько ресурсов, целевой поток (в том числе новый), перенацеливание; Content Browser → контекстное меню ресурса → Clone, Clone to another stream…"
input = "menu+form"
preset = "ZONE=clone:stream=,index=1+2[,to=][,retarget=][,keep]"
[cap.cli]
use = ["clone-resource"]

[[cap]]
id = "res.stream-new"
area = "resources"
title = "Создать новый поток (.str) с записями в таблицах содержимого"
[cap.mcp]
use = ["add_stream"]
[cap.editor]
use = ["cmd.new_stream", "cmd.wizard_zone", "wizard.zone"]
at = "форма New stream: имя, родитель, способ загрузки; мастер New zone — поток, SimGroup и ячейка сетки одной операцией"
input = "menu+form"
preset = "ZONE=stream:name=,parent=[,load=on_demand|with_parent|auto_load]; WIZARD=zone,name=,parent=,min=,max=,step=3"
[cap.cli]
use = ["add-stream"]

[[cap]]
id = "res.stream-remove"
area = "resources"
title = "Удалить поток, созданный рабочим пространством, со всем добавленным в него"
[cap.mcp]
use = ["remove_stream"]
[cap.editor]
at = "Tools → New stream… → список новых потоков → Remove; Content Browser → контекстное меню нового потока → Remove the new stream"
input = "form"
preset = "ZONE=remove-stream:name="
[cap.cli]
use = ["remove-stream"]

[[cap]]
id = "res.direct-write"
area = "resources"
title = "Переписать поток или ресурс прямо в папке игры, минуя рабочее пространство"
[cap.cli]
use = ["repack", "rewrite", "replace"]
[cap.mcp]
never = "запись мимо рабочего пространства: без истории, отмены и diff. Сервер и окно пишут в игру только через apply"
[cap.editor]
never = "то же: окно пишет в игру только через рабочее пространство"

[[cap]]
id = "res.external"
area = "resources"
title = "Править ресурс во внешней программе: каждое сохранение импортируется"
[cap.editor]
at = "полоса Open in external editor над просмотрщиком; вкладка Project → Open in external editor"
input = "form"
preset = "EXTERNAL=<формат>"
[cap.cli]
use = ["edit"]
[cap.mcp]
never = "следить за сохранениями чужой программы агенту незачем: он сам делает export → правка файла → import_file"

