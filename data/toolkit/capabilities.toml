[cap.editor]
use = ["cmd.open_game"]
at = "экран Welcome"
input = "menu"
[cap.cli]
use = ["types"]
partial = "только таблица типов ресурсов; обзора областей и миссий одной командой нет"
[cap.python]
use = ["Game.new", "Game.profile", "Game.root"]

[[cap]]
id = "game.detect"
area = "game"
title = "Найти установленные копии игры и их издание"
[cap.mcp]
use = ["detect_games"]
[cap.editor]
use = ["cmd.find_games"]
at = "экран Welcome → Search again"
input = "menu"
[cap.cli]
use = ["detect"]

[[cap]]
