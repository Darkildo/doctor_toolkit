# What the toolkit can do and where: one row per capability, with the MCP
# tools, the editor actions, the commands of the command line and the Python
# names that give it. The one source of docs/parity.md (`doctor-toolkit
# parity-gen`); the tests of the MCP server, the editor and the command line
# fail when a tool or a command is in no row, or a row names one that does
# not exist (crates/doctor-toolkit/src/parity).
#
# A surface of a row ([cap.mcp], [cap.editor], [cap.cli], [cap.python]):
#   use     names checked against the code: MCP tools; editor command keys
#           (`cmd.*`, `project.cmd`) and wizards (`wizard.<slug>`); command
#           paths of the command line (`level add`); Python names
#           (`Workspace.undo`, `logic_graph`)
#   at      where else it is, in words (a panel and its button, a resource)
#   input   editor: menu, form (fields, buttons), key, mouse (pointer only);
#           several joined with `+`
#   preset  editor: the DOCTOR_TOOLKIT_GUI_* preset that does it hands-free
#   partial what is missing when only a part is there
#   never   why it is not there on purpose
#   gap     what closing the hole takes: add, size (S, M, L), why, needs,
#           bench (true when checking needs the game bench), package
# A surface left out does not have the capability. A hole between MCP and the
# editor must have a `gap` or a `never`.

