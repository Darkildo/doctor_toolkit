# --- Packages of work of stages 103 and 104 --------------------------------

[[package]]
key = "104-A"
stage = 104
title = "Ролики в MCP: вывод ролика в видео (кадры, камеры, ключи, актёры, команды и время субтитров сделаны)"
size = "M"
why = "рендер делает программа редактора без окна; серверу нужна схема долгих задач"

[[package]]
key = "104-P"
stage = 104
title = "База проекта (этап 108) в MCP и Python: записать базу из модов игры и привести моды к базе"
size = "S"
why = "библиотека готова (project::base: record, differences, bring); нужны параметры инструмента и метод Python"

[[package]]
key = "104-F"
stage = 104
title = "Модель из файла на уровень одним вызовом MCP (level::place: образец, импорт в поток зоны, объект — одна операция)"
size = "S"
why = "библиотека готова (level::place::samples, plan, record); образец по точке выбирает она же, нужен инструмент"

[[package]]
key = "104-G"
stage = 104
title = "Смысловые эквиваленты действий мышью: несколько объектов, на землю, маршрут, снимок вида"
size = "L"
why = "коллизия для ходьбы и отрисовка вида живут в крейте редактора (rapier, wgpu): для инструмента их надо вынести или дать редактору работать без окна"

# --- MCP tools by the flag of the server ------------------------------------

[mcp_gates]
edits = [
    "set_attribute", "move_object", "duplicate_object", "add_object", "remove_object",
    "edit_string", "add_string", "edit_script", "scripts", "graph_edit", "undo", "redo",
    "project_build", "mod_build", "validate", "live_objects_to_workspace", "add_stream",
    "remove_stream", "add_zone_cell", "add_simgroup", "add_resource", "clone_resource",
    "import_model", "import_texture", "collision_build", "import_file", "import_sound",
    "import_video", "edit_subtitle", "logic_connect",
    # Stage 104 (packages B, D, E, G).
    "set_tunables", "voice_add", "partsdb_add_part", "partsdb_allow", "set_material", "pack",
    "project_pull", "revert", "remove_zone_cell", "sbk_edit", "sound_add", "set_speech_events",
    "set_mix", "apx_edit", "import_animation", "clip_events", "set_animation_graph",
    "cutscene_camera", "cutscene_actor", "cutscene_command",
    # Stage 111.
    "rebase",
]
game = [
    "apply", "unapply", "play", "stop", "screenshot", "teleport", "send_message", "lua",
    "set_time", "set_money", "set_variable", "stream_load", "stream_unload",
    "move_live_object", "live_object_enable", "live_object_undo", "mods_manage",
    "restore_originals",
    "pause", "resume", "breakpoints", "camera", "push_textures",
]

# --- Game: overview, search, navigation -------------------------------------

