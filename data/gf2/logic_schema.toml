# Pins of SimGroup classes for the logic graph of The Godfather II (PC).
# Generated by research/logic_schema.py from the game files and the decompiled
# attribute readers of godfather2.exe; see docs/logic-graph.md §2.
#
# [packet.<class>] — attributes one class of the hierarchy adds (the packet
# of that class); an object has the packets of all its base classes.
# pin: in (message the object listens to), out (message it sends), link
# (GUID of another object), asset (resource reference), param.
# conf: exe (seen in the code of the reader), data (inferred from the game
# files), guess. name_conf: the same for the name; no name — not known.
# delay: index of the attribute holding the delay of an out pin, seconds.

