# Russian labels and descriptions of the curated game parameters
# (data/gf2/tunables.toml) for the "Change game parameters" wizard.
#
# Kept by hand: research/tunables.py writes only tunables.toml, not this
# file. The key is the `id` of a parameter; a parameter without an entry
# here shows its English label and description. A test of the editor
# checks that every id has both texts and that no id is unknown.

[tunable."weapons.pistol.damage"]
label = "Пистолет: урон"
description = "Урон одной пули, вероятно; у игрока 4500 здоровья. Одно значение для всех четырёх уровней улучшения; Gun 88, 92 и 96 повторяют его, вероятно, как неиспользуемые копии (винтовку сетевой игры перебалансировали только в атрибуте 6)."

[tunable."weapons.pistol.clip_size"]
label = "Пистолет: патронов в магазине"
description = "Патронов в магазине, вероятно (растёт с уровнем улучшения). Одно значение для всех четырёх уровней; атрибуты Gun 90, 94 и 98 повторяют его."

[tunable."weapons.pistol.max_ammo"]
label = "Пистолет: запас патронов"
description = "Сколько патронов к этому оружию игрок может носить, вероятно (растёт с уровнем). Одно значение для всех четырёх уровней; в атрибутах Gun 91, 95 и 99 похожее число."

[tunable."weapons.pistol.fire_interval"]
label = "Пистолет: время между выстрелами"
description = "Секунды между выстрелами, вероятно: меньше — быстрее (у автомата Томпсона от 0.09 на уровне 1 до 0.06 на уровне 4). Одно значение для всех четырёх уровней; Gun 89, 93 и 97 повторяют его (у винтовок — со старыми значениями)."

