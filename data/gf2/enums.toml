[weapon_licence]
title = "Weapon licences"
ru = "Оружейные лицензии"
kind = "int"
source = "level of a made man in the record of his honours (0x008BCF90, byte +0x28): it starts from the flags of his SimNpc (0x00790150: bit 3 gives 2, bit 4 gives 3) and rises with honours (0x008BCE30: 10, 25, 70)"
source_ru = "уровень человека чести в записи его заслуг (0x008BCF90, байт +0x28): начальный — по флагам его SimNpc (0x00790150: бит 3 — 2, бит 4 — 3), растёт с заслугами (0x008BCE30: 10, 25, 70)"
conf = "exe"
values = [
  { name = "basic", value = 1 },
  { name = "advanced", value = 2 },
  { name = "expert", value = 3 },
  { name = "master", value = 4 },
]

