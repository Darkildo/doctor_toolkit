# Resource types of The Godfather II (PC) for the knowledge base (docs/kb/):
# what a type is, how far the toolkit reads it and where it is documented.
# `doctor-toolkit kb-gen` makes a note of docs/kb/resources/ of every entry;
# every tag of type_tags.txt must have one. Kept by hand, in Russian, like
# the documents the entries summarise (docs/formats/resource-types.md §8 and
# the format documents).
#
# status: known (format read in full), partial (read in part, or the purpose
# is known and the format is not), unknown (neither is known).
# confidence: exe, data, bench or guess — what the summary rests on.
# docs: documents with the details, paths from the repository root with an
# optional section after a space.

