[class.TriggerBase]
status = "partial"
ctor = "0x004C0DE0"
reader = "0x004C1550"
handler = "0x004C1260"
summary = "Объём-датчик касания (физический фантом, коробка или сфера). Понятий «вошёл/вышел» в коде нет: срабатывает на каждое сообщение физики о касании (слот 50 таблицы методов), не чаще интервала атрибута 10; при бите со значением 4 флагов (атрибут 8) касание против оси Z объёма шлёт атрибут 7 вместо атрибута 4; при атрибуте 9 = 1 срабатывает один раз, когда сущность перестала касаться. Включён ли при загрузке — бит со значением 1 атрибута 8 (без атрибута выключен). Кого считать — фильтр пакета TriggerFilter промежуточного класса 0x00901860 (по умолчанию только игрок)."
update = "своего покадрового опроса нет: касания приходят из физики вызовом слота 50 (0x004C2200; у наследников 0x009019F0 с фильтром 0x00903E60), вызывающие — сборщики точек контакта 0x0054C540 и 0x00545B40. В режиме атрибута 9 = 1 подписывается на iMsgRunningTick (0x004C2200) и в обработчике 0x004C1260 сравнивает списки касавшихся за прошлый и текущий тик. Выключение откладывается до iMsgRunningPostTick (0x004C1480, 0x004C2130)."
fires = "Касание прошедшей фильтр сущности -> слот 86 (0x009018F0 -> 0x004C1E40): проверка интервала (атрибут 10), скорости (бит со значением 0x10, атрибут 11), направления (бит со значением 4) -> себе iMsgTrigger или iMsgReverseTrigger, сразу (0x00408BB0) или через очередь 0x00440590 с задержкой атрибута 5; данные — BasePtrMsgData со ссылкой на сущность. Обработчик 0x004C1260 по iMsgTrigger рассылает сообщение атрибута 4, по iMsgReverseTrigger — атрибута 7 (0x00408A00), слово данных то же — указатель на BasePtrMsgData сущности. Счётчик атрибута 6 (+0x1F8): если > 0, уменьшается на каждой отправке (обоих видов); на нуле — 0x004088C0 (заявка на удаление объекта) и сохранение состояния."
open = [
  "Слот +0x4C сущности (0x0045C550 у базовой сущности передаёт вызов присоединённому объекту +0x68): по использованию это вектор скорости, сама реализация не прочитана.",
  "Бит 2 (значение 2) атрибута 8: встречается в данных (значения 2, 3, 7, 10, 11), в коде класса (все обращения к +0x1C4 в 0x004C0DE0..0x004C2600) не проверяется; использование не найдено.",
  "Как часто физика вызывает слот 50 для стоящей внутри объёма сущности (каждый шаг или только при движении), не прочитано: от этого зависит, что именно значит режим атрибута 9 = 1 для неподвижной сущности.",
  "0x004088C0 (слот 2 слушателя 0x00461F30 + подписка на iMsgDeleteEntity) понят как заявка на удаление объекта, до конца не прочитан.",
  "Кто читает пакет состояния 0x137726B7 при восстановлении, не прочитано.",
  "В фильтре 0x00903AF0 не прочитаны: объект 0x006BC8B0 у NPC с признаком 0x100 (слот +0x1C), ссылка +0x1E40 (0x007FF880; по смыслу — машина, в которой сидит), бит со значением 4 набора +0x8E0 (0x00690150), слот +0xC0 (по смыслу — здоровье > 0).",
]

