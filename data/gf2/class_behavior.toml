update = "нет: подписок на тики и списков обновления в конструкторе и читателе нет"
fires = "По сообщению атрибута 0, пока остаток срабатываний (+0x60) не 0 и есть хотя бы одна пара. Когда остаток дошёл до 0, слушатель объекта выключается (0x00449E90): снимается бит «включён» слова +4 слушателя, объект подписывается на iMsgDeleteEntity."
open = [
  "В 0x0047A870 при остатке 0 зовётся 0x0043D1B0 с ключом (GUID объекта, 0xFFFFFFFF, 0xFFFFFFFF): что именно он удаляет из хранилища состояний (все записи объекта или одну), не прочитано.",
  "Запись 0x5E1F74A6 создаётся без бита 0 слова +4 (0x0043D5F0 пишет 0): по 0x0043D260/0x0043D300 такая запись попадает в сохранение только при бите 0 слова +0x1C хранилища; кто ставит этот бит, не прочитано.",
  "Зачем выключенный объект подписывается на iMsgDeleteEntity (0x012067C4) и кто это сообщение шлёт, не прочитано: обработчик класса на него не реагирует.",
]

[[class.MultiManager.on]]
msg = "attr:MultiManager:0"
does = "Если остаток (+0x60) не 0 и число пар (+0x5C) не 0: остаток > 0 уменьшается на 1 (−1 не меняется). Без бита 0 флагов — цикл по всем парам в порядке атрибутов 3, 5, …, 17 (пары без имени сообщения читатель выбросил): задержка > 0 — очередь 0x00440590(ручка, 0, задержка, копия данных 0x00476C80 или 0, флаги = флаги объекта & 4); иначе сразу 0x0045C400(ручка, слово данных входящего, force 0). С битом 0 — одна пара с номером +0x5D, номер растёт и обнуляется на числе пар; отправка та же (через 0x004760D0). После отправок, если остаток стал 0, — 0x00449E90: слушатель выключен."
sends = ["attr:MultiManager:3", "attr:MultiManager:5", "attr:MultiManager:7", "attr:MultiManager:9", "attr:MultiManager:11", "attr:MultiManager:13", "attr:MultiManager:15", "attr:MultiManager:17"]
addr = "0x0047A1C0"
conf = "exe"

[[class.MultiManager.on]]
msg = "iMsgStoreEntity"
does = "Подписка есть только при бите 1 флагов. Зовёт 0x0047A870: остаток 0 — удаление по 0x0043D1B0 и запись-метка 0x137726B7 объекта (размер 0) с битом 0 слова +4 (сохранять); остаток не 0 — запись 0x5E1F74A6 размером 4 байта, в данные (+0xC) кладётся остаток. Хранилище — *0x01223418, ключ — GUID объекта (+0x20). Сообщение шлёт всем само хранилище перед сохранением (0x0043D260)."
sends = []
addr = "0x0047A870"
conf = "exe"

[[class.MultiManager.on]]
