[class.HudIndicatorControl]
status = "partial"
ctor = "0x006FB510"
reader = "0x006FB3D0"
handler = "0x006FB910"
summary = "Включает и выключает значок-указатель над объектом атрибута 2: у персонажа — его собственный указатель (вид и имя), у прочих объектов — эффект над объектом."
update = "только пока цель не найдена: обработчик подписывает слушателя на iMsgRunningTick (0x00408680) и каждый тик повторяет попытку; после удачи отписывается (0x004086D0). В конструкторе и читателе подписок нет."
fires = "По сообщениям атрибутов 0 и 1; каждый раз, не отписывается. Данные сообщений не читаются."
open = [
  "0x00737940(персонаж, вид, строка) прочитана частично: виды вне 1..17 убирают указатель; для вида 17 имя берётся из строки, для прочих — из таблицы 0x00E51588, но у видов 1, 3, 4 и дальше есть свои условия, они не разобраны.",
  "0x0072D290(персонаж) (выключение у персонажа) не читана.",
  "0x008E33F0(объект атрибута 6): что возвращает и почему его поля +0x118 и +0x11C подменяют вид и строку.",
  "Для объектов без NPC: 0x0045C740 (создание эффекта по имени из таблицы) и метод объекта +0x58 не читаны.",
]

[[class.HudIndicatorControl.on]]
msg = "attr:HudIndicatorControl:0"
does = "Байт +0x70 = 1, затем применение 0x006FB690; если оно вернуло 0 (объект атрибута 2 не найден) — подписка на iMsgRunningTick. Применение: вид = атрибут 4, строка = атрибут 5; если объект атрибута 6 найден, у него бит 0 байта +0x40 и 0x008E33F0 дал объект с ненулевым +0x118 — вид и строка берутся из него (+0x118, +0x11C; пустая строка заменяется атрибутом 5). Цель — объект по GUID атрибута 2. Если это NPC (0x369AC561): 0x00737940(персонаж, вид, строка). Иначе, если есть Entity: над точкой объекта создаётся эффект с именем из таблицы 0x00E51588[вид] (0x0045C740), смещение (0, атрибут 3, 0) передаётся в метод объекта +0x58; ручка эффекта кладётся в +0x88."
sends = []
addr = "0x006FB690"
conf = "exe"

