[class.UnlockCheck]
status = "full"
ctor = "0x00906680"
reader = "0x009065C0"
handler = "0x00906860"
summary = "Проверка «открыто ли дополнение». При загрузке шлёт одно из двух сообщений: атрибут 0, если номер проверки (атрибут 2) равен 0 и в объекте денег и семьи игрока стоит флаг дополнения (*0x01129908 +0x18), иначе атрибут 1. В игре 4 объекта: ими закрыты рекруты дополнений (r01_PDLC_spawn_OK, spawn_preOrder, spawn_dlc_crew_jack_of_all_trades)."
update = "нет: подписок на тики и списков обновления в конструкторе 0x00906680 и читателе 0x009065C0 нет"
fires = "Один раз, на iMsgPostSpawnInitialize: атрибут 0 или атрибут 1."
open = [
  "Флаг *0x01129908 +0x18 ставят 0x00935580 и 0x009359A0 (сетевая часть: ответ службы 0x00AE0AD0 и бит 0 байта +6 записи *0x0113056C) — что именно они проверяют, не читалось; флаг пишется в сохранение (блок player-family, слово 0x0C).",
]

[[class.UnlockCheck.on]]
msg = "iMsgPostSpawnInitialize"
does = "Если атрибут 2 равен 0 и байт *0x01129908 +0x18 не равен 0 — шлёт сообщение атрибута 0, иначе — атрибута 1 (0x00408A00, без данных); затем отписывается (0x004086D0). При атрибуте 2, не равном 0, атрибут 0 не шлётся никогда."
sends = ["attr:UnlockCheck:0", "attr:UnlockCheck:1"]
addr = "0x00906860"
conf = "exe"

