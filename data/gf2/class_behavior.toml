open = [
  "0x00792560 (вызывается при бите 21 флагов SimNpc) прочитана по форме: убирает SimNpc из списка по ключу 0x007914E0.",
]

[[class.AddPlayerFamilyMember.on]]
msg = "attr:AddPlayerFamilyMember:0"
does = "SimNpc ищется по GUID атрибута 1 (0x00446100, реестр 0x01223410); не найден — ничего. Ранг — больший из атрибута 2 и нынешнего ранга SimNpc (0x00791750); если атрибут больше, ранг записывается (0x00791670). Затем 0x0090B690 открывает место этого ранга, поднимая уровень древа (*0x0112989C +0x14), пока свободное место не появится, и 0x0090B4E0 записывает SimNpc в свободное открытое место этого ранга со специальностями атрибута 3; уже состоящего в семье не трогает. При бите 0 атрибута 4 — 0x0090A660: ставит биту 24 флагов SimNpc 1 (он в команде, идущей за игроком) и, если его персонаж сейчас в мире, присоединяет его к команде (0x009B1E40). Объект остаётся подписан: повторное сообщение проходит тот же путь. Проверено на стенде (game-bench.md §44)."
sends = []
addr = "0x0090A370"
conf = "exe"

