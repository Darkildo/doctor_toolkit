does = "Подписка есть только при бите 1 флагов. Зовёт 0x0047A8E0: если есть запись 0x5E1F74A6 — остаток (+0x60) берётся из неё; если есть метка 0x137726B7 — 0x00449E90 (слушатель выключен). Сообщение шлёт хранилище после чтения сохранения (0x0043D450)."
sends = []
addr = "0x0047A8E0"
conf = "exe"

