does = "Ставит бит 1 в маске пришедших (+0x74). Сравнение ручек идёт цепочкой else-if в порядке условие 1, 2, 3, 4, сброс: сообщение, совпавшее с несколькими ручками, засчитывается только первой. Затем общая проверка: +0x74 == +0x70 — отправка атрибута 4 (задержка +0x78 ≤ 0 — сразу 0x00408A00 с данными-ссылкой на себя, force 0; иначе очередь 0x00440590 с новым объектом данных 0x0045CA00 и флагами 0) и +0x74 = 0. Перед своей работой (у реле — после) зовёт обработчик базы 0x0046C6A0: если у объекта есть компоненты (слова +0x34 и +0x38 не ноль) и байт сообщения +8 равен 0, сообщение передаётся компонентам с флагом 2 через 0x00482A50 -> 0x00408BF0; по iMsgNotifyDeleteEntity (0x012067DC) компоненты удаляются (0x00482990)."
