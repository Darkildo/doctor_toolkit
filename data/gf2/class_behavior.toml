[class.EnterExitTrigger]
status = "partial"
ctor = "0x008FFC50"
reader = "0x00900FF0"
handler = "0x00900E20"
summary = "Объём-коробка (фантом, 0x00900EC0), который действительно отслеживает вход и выход: касания прошедших фильтр TriggerFilter сущностей (слот 50 0x00900970) отмечаются флагом, а обновление 0x00900B80 сравнивает «касались в этом тике» с «касались в прошлом» и шлёт вход (атрибут 0), выход (атрибут 1) и, пока внутри, повторяющееся «внутри» (атрибут 2) с периодом атрибута 3. Простой режим — одно состояние на объём, сообщения без данных; при бите со значением 4 атрибута 6 — учёт по каждой сущности, данные — ссылка на сущность."
update = "0x00900B80, вызывается через переходник 0x00900FE0 из списка обновления 0x19 (регистрация слотом 5 0x00900060 -> 0x008F6F50, сообщение iMsgTickLinked; таблица переходников 0x008F6870). Зарегистрирован, пока включён и заспавнен (флаг 0x2000) или пока было касание (флаг 0x1000)."
fires = "В обновлении. Простой режим: касание есть, а в прошлом тике не было — атрибут 0; касания нет, а было — атрибут 1; пока есть или было — атрибут 2 не чаще периода атрибута 3. Все три — рассылка 0x00408A00 через 0x00900260 со словом данных 0. Режим списков: для каждой сущности текущего списка, которой нет в прошлом, — атрибут 0; для остальных атрибут 2 по её собственному таймеру; для сущностей прошлого списка, которых нет в текущем, — атрибут 1; слово данных — BasePtrMsgData сущности. Сообщение шлётся, только если его атрибут задан (биты со значением 1/2/4 слова +0x182)."
open = [
  "Бит со значением 2 атрибута 6 копируется в +0x180, его проверка в коде класса (0x008FFC50..0x00901220) не найдена.",
  "Как часто физика вызывает слот 50 для неподвижной сущности внутри объёма, не прочитано (как у TriggerBase); от этого зависит, не будет ли ложного выхода у стоящего игрока.",
  "Список обновления 0x19 (0x008F6ED0, кто и когда обходит) прочитан только до регистрации.",
  "Остальные методы сущности (слоты 31-34: спавн, деспавн, смена матрицы) просмотрены только в части флагов 0x4000/0x2000.",
]

