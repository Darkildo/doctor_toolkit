[class.TriggerAuto]
status = "full"
ctor = "0x00477DB0"
reader = "0x00478040"
handler = "0x00477EF0"
summary = "Один раз после загрузки своей группы шлёт сообщение атрибута 0, сразу или с задержкой; в данных сообщения — указатель на сам объект."
update = "нет: подписок на тики и списков обновления в конструкторе и читателе нет"
fires = "По iMsgPostSpawnInitialize, один раз: подписка — в конструкторе 0x00477DB0 (0x004084D0(0x0120E93C, 0x7FFF)); после отправки объект отписывается и выключает слушатель."
open = [
  "Зачем после срабатывания объект подписывается на iMsgDeleteEntity (0x012067C4) и кто его шлёт, не прочитано: обработчик на него не реагирует.",
  "Когда метка 0x137726B7 удаляется из хранилища (сброс по маске категории 0x0043CFC0), не прочитано.",
]

[[class.TriggerAuto.on]]
msg = "iMsgPostSpawnInitialize"
does = "Задержка (+0x58) > 0 — очередь 0x00440590(ручка +0x50, 0, задержка, новый объект данных со ссылкой на себя 0x0045CA00, флаги = (флаги & 2) * 2, то есть 4 при бите 1); иначе сразу 0x00408A00 с данными-ссылкой на себя, force 0. Затем: отписка от iMsgPostSpawnInitialize (0x004086D0), слушатель выключается (метод +8 слушателя, 0x00461F30), подписка на iMsgDeleteEntity. При бите 0 флагов: если у объекта нет записи 0x137726B7 в хранилище *0x01223418, она создаётся (0x0043D020, размер 0) с битом 0 слова +4 (сохранять)."
sends = ["attr:TriggerAuto:0"]
addr = "0x00477EF0"
conf = "exe"

