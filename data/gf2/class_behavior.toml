summary = "По сообщению атрибута 0 делает заданного SimNpc человеком чести семьи игрока: поднимает его ранг, открывает место этого ранга в древе семьи, если сюжет его ещё не открыл, и записывает его в место со специальностями атрибута 3. В игре 20 объектов, все в gf2/globals_global: служебные наборы add_demo_family, MP_Crew_loaded, dev_miami_start_family, dev_cuba_start_family."
update = "нет: подписок на тики и списков обновления в конструкторе 0x0090A110 и читателе 0x0090A1D0 нет"
