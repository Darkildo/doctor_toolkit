does = "0x00477A90: находит индекс переменной (0x004420F0; нет — 0x004088C0, объект выключается). Если предел (+0x88) равен 0 или счётчик (+0x84) меньше предела (беззнаково): вызывает проверку 0x00477BE0 с текущим значением; вернула 0 (не сработала или стоит флаг 4) — записывает себя в наблюдатели переменной (0x00441D90); без флага 4 снимает одну подписку на это сообщение (пока следит, повторное включение не слышит). Если предел исчерпан — не делает ничего. Проверка: значение 2 в атрибуте 5 и x == значение, или 1 и x < значение, или 4 и x > значение (знаковые); при успехе без флага 4 снова подписывается на атрибут 0, шлёт атрибут 2, счётчик +1, возвращает 1 без флага 4 (наблюдатель снимается) и 0 с флагом 4. Проверка при записи в переменную предел не смотрит."
