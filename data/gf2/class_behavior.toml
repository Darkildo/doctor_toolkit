does = "Снимает бит 30 флагов и зовёт открытие 0x00796BA0(дверь, актёр = сама дверь, -1.0). Проверка 0x00795A90 для актёра-не-игрока: запертая дверь (бит 0), дверь с битами 6, 27, 29 и дверь с незагруженным потоком атрибута 23 не открывается — вместо этого не чаще раза в секунду играет звук «заперто». Иначе 0x00794930 переводит дверь в состояние 1 (открывается), вместе с парной дверью атрибута 16."
sends = []
addr = "0x00797220"
conf = "exe"

[[class.Door.on]]
msg = "attr:Door:12"
does = "То же открытие 0x00796BA0, но на время вызова стоит бит 30 (0x40000000) флагов; после вызова бит снят. Что меняет бит — не найдено."
sends = []
addr = "0x00797220"
conf = "exe"

[[class.Door.on]]
msg = "attr:Door:13"
does = "Закрыть. Ставит бит 27, если стоит бит 4 флагов, либо если GUID (какой — аргумент 0x004209A0 декомпилятор потерял, по смыслу атрибут 23) не нулевой, дверь открыта (+0x2B8 == 0) и поток атрибута 23 не загружен. Если бит 27 не стоит и в проёме никого нет (0x007967A0: ни Sentient, ни машины WhiteboxCar в объёме двери) — обнуляет таймер +0x2A4 и ставит бит 26 «закрыть»; обновление 0x007968E0 переводит дверь в состояние 3."
sends = []
addr = "0x00797220"
conf = "exe"

[[class.Door.on]]
msg = "attr:Door:14"
does = "Запереть: работает, если стоит бит 7 флагов или не стоит бит 28 (заперта зданием). Ставит бит 0, сообщает компоненту +0x130 (вызов +0x44 с 0x6F74AF5B, 1) и пересчитывает преграду 0x00794600."
sends = []
addr = "0x00797220"
conf = "exe"

[[class.Door.on]]
msg = "attr:Door:15"
does = "Отпереть: то же условие (бит 7 или нет бита 28). Снимает бит 0; если дверь закрыта (+0x2B8 == 2) — сообщает компоненту (0x6F74AF5B, 0); пересчитывает преграду 0x00794600."
sends = []
addr = "0x00797220"
conf = "exe"

