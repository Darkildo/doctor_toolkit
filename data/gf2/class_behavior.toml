# Behaviour of SimGroup classes of The Godfather II (PC 1.0.789.0), read in the
# code of godfather2.exe (stage 79). Kept by hand; `doctor-toolkit kb-gen` puts
# it into the class notes (docs/kb/classes/), the logic graph takes attribute
# names and message pins from it (over data/gf2/logic_schema.toml), and
# research/class_behavior.py checks it. How the code was read and what the
# fields of the objects are: docs/analysis/class-behavior.md.
#
# [class.<Name>]: a class, or a packet of base attributes that several classes
# share (TriggerBase, AttributeRelay, NPCRequester, Base, CSystemCommands).
#   status   full: constructor, attribute reader, message handler and update
#            of the class itself are read to the end (`open` may still hold
#            questions about engine code the class calls); partial: a part of
#            the class code is not read, `open` says which.
#   ctor, reader, handler   addresses (virtual, start of the function).
#   summary, update, fires, open   text (Russian): what the class does, what
#            it does every tick, when it fires, what is not known.
# [[class.<Name>.on]]: a reaction of the message handler. msg is the name of
#   an engine message or `attr:<Packet>:<index>` (a message named by an
#   attribute); sends lists the messages sent in the reaction.
# [[class.<Name>.attr]]: an attribute as the reader uses it. packet + i name
#   it; name is ours (snake_case; conf says whether the meaning is seen in the
#   code, `exe`, or the name is a guess); kind is how the code uses the value:
#   int, float, bool, flags (bits listed in `does`), enum, hash, string, guid,
#   vec3, matrix, msg_in (a message the object listens to), msg_out (a message
#   it sends); field is where the reader stores it in the object.
#   unit = "seconds" marks a float the code uses as a time in seconds
#   (research/attr_types.py makes it the type `seconds`; a `bool` kind becomes
#   the type `bool`).
# Bits in `does` are written `бит 0 (1)` (number, value in brackets) or
# `бит со значением 4`.
# An attribute that a packet does not store is still given to the reader, as 0
# or an empty string (0x0043AFF0 and the walk in every reader): the value the
# constructor wrote survives only when the object has no such packet at all.


[class.Base]
status = "full"
summary = "Пакет, который есть почти у каждого объекта; его единственный атрибут решает, создаётся ли объект при загрузке группы. Решает не класс, а менеджер объектов до создания (0x00446BF0, зовётся из 0x00446340)."
update = "нет: это пакет базовых атрибутов, своего кода у него нет"
fires = "Не срабатывает."
open = [
  "Кто и когда ставит маску запрета в слове +0x24 менеджера объектов и кто зовёт 0x00446BF0 с третьим аргументом не 0, не прочитано.",
  "Что делает вызывающий код с ответом «бит 2 не стоит» (пятый аргумент 0x00446BF0), не прочитано.",
]

[[class.Base.attr]]
packet = "Base"
i = 0
name = "spawn_flags"
kind = "flags"
does = "Флаги создания объекта; в файлах игры всегда 1 (100 032 объекта) или не записан. Бит 0 (1): объект создаётся и в режиме, когда 0x00446BF0 зовут с третьим аргументом не 0 (без бита — в этом режиме не создаётся). Любой бит, совпавший с маской в слове +0x24 менеджера объектов, запрещает создание. Бит 2 (4): пятый выходной аргумент 0x00446BF0 получает 0 вместо 1. В двоичной записи объекта значение продублировано в байте 0x1D, а бит 1 байта флагов 0x1C говорит, что пакет Base у объекта есть: загрузчик читает байт и пакет не обходит."
addr = "0x00446BF0"
conf = "exe"

