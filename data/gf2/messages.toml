data = "unknown"
sent_by = ["cut-scene (trinity_seq_master): text command 0x402 of kind 1, a message to the bus"]
sent_by_ru = ["ролик (trinity_seq_master): текстовая команда 0x402 вида 1 — сообщение на общую шину"]
