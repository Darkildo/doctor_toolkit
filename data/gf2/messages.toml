data = "EARS::Framework::Lua::MsgData* (vtable 0x00E365DC); the listener appends five values (aud_dons_view_sfx.lua reads sVenueID, sVenueType, sVenueStatus, sCurrentMonopoly, sVenueUnderAttack)"
sent_by = ["Lua: SendMessageEx (0x004C86D0) of aud_dons_view_sfx.lua; the name is set by 0x006B01E0"]
sent_by_ru = ["Lua: SendMessageEx (0x004C86D0) скрипта aud_dons_view_sfx.lua; имя задаёт 0x006B01E0"]
conf = "exe"
source = "docs/analysis/lua-api.md §2"

# ---------------------------------------------------------------------------
# The data word of a message (stage 78, docs/analysis/message-bus.md §4).
#
# [data_type.<key>] — what the word can be:
# table   — address of the method table of the data object, when it is one
#           (the `obj:0x…` of data/gf2/bus_sites.tsv);
# summary — English (tools); ru — Russian (notes); conf, source as above.
#
# The word is 0 or a pointer to an object the sender builds on its stack; the
# first word of the object is its method table (one method, the destructor).
# The executable has no names for these classes: the keys are the toolkit's.

[data_type.none]
summary = "No data: the word is 0."
ru = "Данных нет: слово равно 0."
conf = "exe"
source = "data/gf2/bus_sites.tsv"

[data_type.object]
table = "0x00E31E2C"
summary = "Pointer to an object: {table, object + 0x48, next} — a link of the object's list of safe pointers (BasePtrMsgData in the declarations of the attribute readers). Which object, the sender decides: itself, or who entered a trigger."
ru = "Указатель на объект: {таблица, объект + 0x48, следующий} — звено списка безопасных указателей объекта (BasePtrMsgData в пометках читателей атрибутов). Чей объект, решает отправитель: он сам или тот, кто вошёл в триггер."
conf = "exe"
source = "0x0045CA00 (constructor), 0x00476C80 (copy for the delayed queue)"

[data_type.forward]
summary = "The data word of the message the sender reacted to, passed on unchanged (for the delayed queue an object pointer is copied)."
ru = "Слово данных сообщения, на которое отправитель сработал, без изменений (для очереди задержки указатель на объект копируется)."
conf = "exe"
source = "0x0047A1C0 (MultiManager)"

[data_type.word]
summary = "A plain word that is not a data object: a stream, a number."
ru = "Простое слово, не объект данных: поток, число."
conf = "exe"
source = "0x004499E0 (iMsgStreamVisible)"

[data_type.building]
table = "0x00D5DBB0"
