# Facts about single messages of The Godfather II (PC 1.0.789.0) that the
# generated lists cannot hold: what a message does, what its data word is, who
# sends it besides SimGroup objects. Kept by hand; every entry names its source.
#
# The lists themselves: data/gf2/engine_messages.txt (names in godfather2.exe)
# and data/gf2/game_messages.tsv (names in the SimGroups, with senders and
# listeners). A message named here must be in one of them
# (crates/doctor-toolkit/build.rs checks).
#
# [message.<name>]
# summary — one sentence, English (tools); ru — the same in Russian (notes);
# data    — the data word of the message; "unknown" until it is read in the code;
# sent_by — senders that are not SimGroup objects (engine code, cut-scenes, Lua);
#           sent_by_ru — the same in Russian (as many entries);
# conf    — exe, data, bench (checked in the running game), guess;
# source  — document and section, or an address.

[message.iMsgPostSpawnInitialize]
summary = "The engine sends it to the objects of a SimGroup that has just been loaded; TriggerAuto fires on it once."
ru = "Движок шлёт его объектам только что загруженной SimGroup; по нему один раз срабатывает TriggerAuto."
data = "unknown"
sent_by = ["engine: message variable 0x0120E93C, named by 0x004455D0; delivered to each listener (0x00408BF0) from 0x00446470 and 0x00855D40"]
sent_by_ru = ["движок: переменная сообщения 0x0120E93C, имя задаёт 0x004455D0; доставка каждому слушателю (0x00408BF0) из 0x00446470 и 0x00855D40"]
conf = "exe"
source = "docs/logic-graph.md §9.2"

