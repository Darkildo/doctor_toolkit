[[function]]
name = "GetFootPoliceIntensity"
kind = "c"
group = "police"
register = ["0x007874FB"]
impl = "0x00787470"
args = ""
returns = "intensity: number | nil"
ru = "0x787470. Читает CrimeManager *0x112AA1C (конструктор 0x7869d0), поле +0x2C74 — указатель на текущую запись преступления (выбирает 0x785c70). Указатель не нулевой: всегда 0.0; нулевой: nil. Настоящей интенсивности не возвращает. Регистрирует 0x7874f0 — метод Register привязки CrimeManager+0x2C68 (vtable 0xD69808), вызывается LuaManager для обоих состояний."
conf = "bench"
bench = "§35"

