impl = "0x004370A0"
args = "handle: lightuserdata|userdata, volume: number"
returns = "-"
ru = "0x4370a0 -> 0x5e6700(handle, volume) -> 0x5e5fe0. Оба аргумента обязательны (число или числовая строка), иначе молча ничего."
conf = "exe"

