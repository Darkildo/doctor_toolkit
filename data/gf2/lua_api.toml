ru = "0x880430. Слот погони index 0..3 (иначе 0) в таблице 0x112E168 (по 12 байт: handle эмиттера, хэш звука, машина). Машина есть: true, handle, машина[+0x1BC], машина[+0x34], машина[+0x140], квадрат расстояния до игрока (позиция 0x471610()+0x30). Слот пуст: false, lightuserdata(0), 0, 0, 0, 1e7. От того, сидит ли игрок в машине, не зависит."
conf = "bench"
bench = "§35"

[[function]]
name = "SetChaseVehicleSound"
