[[function]]
name = "PlayEmx"
kind = "c"
group = "emitters"
register = ["0x00435BFE"]
impl = "0x00436A90"
args = "name: string|number, volume?: number, pitch?: number, flag?: boolean, position?: userdata|lightuserdata, param6?: number"
returns = "handle: lightuserdata"
ru = "0x436a90. Хэширует имя sdbm(lower) 0x4dafd0 и запускает эмиттер через 0x5e49d0(хэш, менеджер *0x12234BC, &params); params[+0]=int(param6), params[+0xC]=1 только если flag == true (boolean). Затем 0x5e67c0(handle, *0x110AC04), pitch через 0x5e6750, position (указатель на 3 float) через 0x5e6580, volume через 0x5e6700. Имя не строка/не найдено: без ошибки, возвращает lightuserdata(0) (в Lua это истина). Смысл flag и param6 в коде не раскрыт (guess: зацикливание/приоритет)."
conf = "bench"
bench = "§35"

[[function]]
name = "PlayEntityEmx"
kind = "c"
group = "emitters"
register = ["0x00435C5E"]
impl = "0x00436D20"
args = "name: string|number, volume?: number, pitch?: number, flag?: boolean, entity: userdata|lightuserdata, param6?: number"
returns = "handle: lightuserdata (или 0 результатов)"
ru = "0x436d20. Вызывает entity->vtbl[+0xAC](name, &params) (эмиттер, привязанный к объекту); pitch умножается на entity->vtbl[+0x110](), зажатое в [0.3, 1.0]; затем 0x5e67c0, volume 0x5e6700. Если entity не userdata/lightuserdata: молча возвращает 0 результатов; если name не строка: lightuserdata(0). В скриптах игры не вызывается."
conf = "exe"

[[function]]
name = "StopEmx"
kind = "c"
group = "emitters"
register = ["0x00435CB1"]
impl = "0x00437020"
args = "handle: lightuserdata|userdata"
returns = "-"
ru = "0x437020. Индекс слота = младшие 16 бит handle (< 0x200), слот = *0x12234BC + 0x10 + i*0x30; если слот[+0x2C] == handle, вызывает 0x5e5e60(i, 0) (остановка с освобождением). Лишние аргументы игнорируются; неверный handle: молча."
conf = "exe"

