kind = "c"
group = "groups"
register = ["0x00E32150"]
impl = "0x00469E60"
args = "self, name: string|number"
returns = "group: Group | nil"
ru = "0x469e60. Поиск слота по sdbm(name) 0x43c250 в *0x1223414; не найдено — nil, группа не создаётся. Ошибка: \"Expected group name argument to GroupManager:FindGroup.\\n\"."
conf = "bench"
bench = "§35"

