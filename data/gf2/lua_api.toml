[[function]]
name = "SetStreamEffect"
kind = "c"
group = "effects"
register = ["0x004360E8"]
impl = "0x004380D0"
args = "stream: number, p2: number, p3: number, p4: number, p5: number, p6: number"
returns = "-"
ru = "0x4380d0 -> 0x458f10 -> 0x4587c0(поток, p2..p6). Все 6 обязательны, stream 0..1. Параметры эффекта потока шлются в микшер 0xca4e90 (p5 и p6 зажимаются в [0,100], p4 от 2.0). Смысл параметров в коде не подписан. В скриптах не вызывается."
conf = "exe"

[[function]]
name = "SetGlobalEffect"
kind = "c"
group = "effects"
register = ["0x0043613B"]
impl = "0x00438600"
args = "a1: number, a2: number, a3: number, a4: number, a5: number, a6: number"
returns = "-"
ru = "0x438600 -> 0x5e3d90 -> (*0x1223510)->vtbl[+0xBC](&desc, a6). desc = {+0: 0x9C, +4: a4, +8: a3 (умолч. 15.0), +0xC: a5 (умолч. 1.0), +0x10: a1, +0x14: a2}. Все 6 обязательны, иначе молча. Смысл полей — guess: параметры глобального ревербератора, a6 — время перехода."
conf = "exe"

[[function]]
name = "SetPluginEffect"
kind = "c"
group = "effects"
register = ["0x0043618E"]
impl = "0x004383B0"
args = "submix: string|number, plugin: string|number, paramIndex: number, value: number"
returns = "-"
ru = "0x4383b0 -> (*0x1223510)->vtbl[+0xC0](&desc). desc = {sdbm(submix), sdbm(plugin), int(paramIndex), value, 0, 0, флаги 1,1,1}. value обязателен (иначе молча); первые три при неверном типе дают 0. Скрипты: (\"SUBMIX1\", \"Delay\", 0, x)."
conf = "exe"

[[function]]
name = "SetAuxEnabled"
kind = "c"
group = "effects"
register = ["0x004361E1"]
impl = "0x00438300"
args = "enabled: boolean"
returns = "-"
ru = "0x438300. Только boolean. Вызывает (*0x1223510)->vtbl[+0xC0] с описателем {sdbm(\"SOUND_PLAYER\"), sdbm(\"Aux1\"), ..., флаг enabled}: включает/выключает посыл Aux1."
conf = "exe"

[[function]]
name = "SetStreamChannelEffectSend"
kind = "c"
