[[function]]
name = "SetEmxAzimuth"
kind = "c"
group = "emitters"
register = ["0x00435DFD"]
impl = "0x00437270"
args = "handle: lightuserdata|userdata, angleY: number, angleX: number, distance: number"
returns = "-"
ru = "0x437270. Берёт слушателя 0 (0x5e73f0) и его позицию (0x5e7a40), вектор (0,0,distance) поворачивает на angleX градусов вокруг оси X (0xE2E5F8) и на angleY градусов вокруг оси Y (0xE2E604) (0x4a0370, градусы*0.0174533), прибавляет к позиции слушателя и ставит через 0x5e6580. Все 4 аргумента обязательны, иначе молча."
conf = "exe"

[[function]]
name = "PlayStream"
kind = "c"
group = "music_streams"
register = ["0x00435E50"]
impl = "0x00437700"
args = "stream: number, name: string|number, offset?: number"
returns = "-"
ru = "0x437700 -> 0x458d10(менеджер *0x12233FC, hasOffset, offset, delay=0.0). stream — 0 или 1; к имени дописывается \".exa\" (0x4d3ca0) и ищется запись 0x456070; найдена: 0x458110 запускает сразу, поток[+0xD0]=категория микса записи. Не найдена: ставится флаг ошибки поток[+0x200] (GetStreamStatus вернёт 0). offset — guess: секунды (скрипты: длительность_мс*0.001). Неверные типы: молча."
conf = "exe"

[[function]]
name = "PrimeStream"
kind = "c"
group = "music_streams"
register = ["0x00435EA3"]
impl = "0x004374B0"
args = "stream: number, name: string|number, offset?: number"
returns = "-"
ru = "0x4374b0. То же, что PlayStream, но delay = 100000.0 (double 0xE44970): поток открывается и буферизуется, время старта отложено (поток[+0x100] = часы микшера + delay); запуск — StartStream."
conf = "exe"

[[function]]
name = "StartStream"
kind = "c"
group = "music_streams"
register = ["0x00435EF6"]
impl = "0x00437610"
args = "stream: number"
returns = "-"
ru = "0x437610 -> 0x4582c0: обнуляет отложенное время старта поток[+0x100] и, если голос уже создан (поток[+0x16C]==1), шлёт команду старта. stream вне 0..1: молча."
conf = "exe"

[[function]]
name = "StopStream"
