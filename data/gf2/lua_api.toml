[[function]]
name = "RegisterGroup"
owner = "GroupManager"
kind = "c"
group = "groups"
register = ["0x00E32148"]
impl = "0x00469DB0"
args = "self, name: string|number"
returns = "group: Group"
ru = "0x469db0. Имя читается из 2-го аргумента (вызов через двоеточие). sdbm(name) -> 0x43c140(менеджер *0x1223414, хэш, 1): находит или занимает один из 64 слотов (по 0x1C байт: хэш, счётчик ссылок, список, число членов) и увеличивает счётчик ссылок. Возвращает userdata Group (индекс слота). Ошибки: \"Expected group name argument to GroupManager:RegisterGroup.\\n\", \"Problems registering group '%s'\\n\"."
conf = "bench"
bench = "§35"

[[function]]
name = "FindGroup"
