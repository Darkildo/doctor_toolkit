# What godfather2.exe (PC 1.0.789.0) gives to Lua scripts: every function and
# table it registers in the Lua state of the game. One source for the notes
# of the knowledge base (`doctor-toolkit kb-gen`), the Lua stub
# (`doctor-toolkit types-gen`), `game_types::lua_api` (build.rs) and the
# checks of the mock API (script::sim).
#
# Addresses come from `research/lua_api.py scan` (and `check` compares this
# file with the exe); signatures and descriptions are read from the code by
# hand: docs/analysis/lua-api.md.
#
# [[group]]    — a subsystem: key, title (English, tools), ru (notes).
# [[table]]    — a table or metatable: name, kind (`global` — a global table,
#                `metatable` — methods of a userdata type, `library` — a
#                standard Lua library, `lua` — made by Lua text embedded in
#                the exe), ru.
# [[function]] — name; owner (a [[table]]; none — a global function);
#   kind     — c (a C function of the game), lib (a standard function of Lua
#              5.0 or tolua: no signature here), lua (defined by Lua text
#              embedded in the exe: `source` is the address of the text);
#   register — where it is registered: the call of lua_pushstring, or the
#              entry of a {name, function} array (twice: once per Lua state);
#   impl     — the C function;
#   args, returns — the Lua-side signature; `?` — may be left out;
#              "(последний аргумент)" — the function returns 1 without pushing,
#              so the script gets its own last argument back;
#   ru       — what it does (Russian, for the notes);
#   conf     — exe (read in the code), bench (also seen in the running game),
#              guess;
#   bench    — the section of docs/analysis/game-bench.md with the check.
# [[missing]]  — names the game's scripts call that the exe does not define.

