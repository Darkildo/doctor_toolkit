impl = "0x00438830"
args = "stream: number, channel: number, send: number"
returns = "-"
ru = "0x438830 -> 0x458740. stream 0..1, channel 0..7; send зажимается в [-1, 1]; команда 0xca4e90(0, send) каналу потока. Все три обязательны. В скриптах не вызывается."
conf = "exe"

[[function]]
name = "GetStreamStatus"
kind = "c"
group = "music_streams"
register = ["0x00436287"]
impl = "0x00438970"
args = "stream: number"
returns = "status: number"
ru = "0x438970 -> 0x4589a0. 0 = ошибка (флаг поток[+0x200], сбрасывается при чтении) или остановка (поток[+0x170]==2); 1 = буферизация (поток[+0x170] 1 или 3); 2 = играет (поток[+0x16C]==1); 3 = свободен. Неверный аргумент или stream вне 0..1: 0. Скрипты: {Error, Buffering, Active, Available}."
conf = "bench"
bench = "§35"

[[function]]
name = "GetStreamDuration"
kind = "c"
group = "music_streams"
register = ["0x004362DA"]
impl = "0x00438A80"
args = "stream: number"
returns = "seconds: number"
ru = "0x438a80 -> 0x458a20: поток[+0x1E4] (uint, мс) * 0.001, если голос активен (поток[+0x16C]==1); иначе и при неверном аргументе -1."
conf = "exe"

[[function]]
name = "SetStreamPrimeFunction"
kind = "c"
group = "music_streams"
register = ["0x0043632D"]
impl = "0x00437B70"
args = "stream: number, functionName: string"
returns = "-"
ru = "0x437b70. Запоминает L и имя (непустое, < 64 символов) в *0x12233F0 + 8 + stream*0x44 и ставит C-обработчик 0x437a80 (0x458cd0). Когда поток сообщает состояние 2, обработчик ищет глобал по имени (gettable 0x633cb0), если это функция — вызывает её с одним аргументом stream (pcall 0x636570, без результатов) и снимает регистрацию (однократно)."
conf = "exe"

[[function]]
name = "PrimeEarsAudioStream"
kind = "c"
group = "ears_streams"
register = ["0x00436380"]
impl = "0x00438F40"
args = "name: string|number, volume: number = 1.0, category?: string|number"
returns = "handle: lightuserdata"
ru = "0x438f40 -> общий помощник 0x438bb0(name, category, volume). Имя хэшируется как есть: sdbm(lower(name)) 0x4dafd0 (расширение не добавляется и не убирается: \"x.stx\" передают с .stx) и ищется 0x456010 в каталоге *0x12233F8 (сравнение с запись[+0x6C]). Найдено: путь строит 0x4a8460, параметры из записи 0x4a84d0 (затухания, приоритет, категория), category при наличии заменяет категорию записи хэшем; 0x5e25f0 занимает один из 5 слотов менеджера *0x122350C (нужен флаг [+0x1744]). handle = счётчик менеджер[+0x1748] (1,2,3...), а не указатель. Неизвестное имя/нет слота/имя не строка: без ошибки, lightuserdata(0) (истинно в Lua). Поток только открыт, не запущен. В скриптах не вызывается."
conf = "bench"
bench = "§35"

[[function]]
name = "PlayEarsAudioStream"
kind = "c"
group = "ears_streams"
register = ["0x004363D3"]
impl = "0x00438D10"
args = "nameOrHandle: string|number|lightuserdata|userdata, volume: number = 1.0, category?: string|number"
returns = "handle: lightuserdata"
ru = "0x438d10. Строка: то же, что PrimeEarsAudioStream (0x438bb0), затем старт 0x5e1fd0(handle): слот[+0x20C]=0x32 и (*0x1223510)->vtbl[+0x9C]. handle (от Prime): volume игнорируется, category при наличии пишется хэшем в слот[+0x248] (0x5e2230), затем тот же старт; возвращается тот же handle. Неизвестное имя: без ошибки, lightuserdata(0). Аргумент иного типа: lightuserdata(0)."
conf = "bench"
bench = "§35"

[[function]]
name = "StopEarsAudioStream"
kind = "c"
group = "ears_streams"
