[workspace]
resolver = "3"
members = ["crates/doctor-toolkit", "crates/doctor-toolkit-cli", "crates/doctor-toolkit-gui", "crates/doctor-toolkit-live", "crates/doctor-toolkit-mcp", "crates/doctor-toolkit-mods", "crates/doctor-toolkit-py"]
# The Python module is built with maturin (see crates/doctor-toolkit-py); plain
# `cargo build` and `cargo test` leave it out, `--workspace` builds it too.
default-members = ["crates/doctor-toolkit", "crates/doctor-toolkit-cli", "crates/doctor-toolkit-gui", "crates/doctor-toolkit-live", "crates/doctor-toolkit-mcp", "crates/doctor-toolkit-mods"]
# The in-game module is a Windows DLL (i686-pc-windows-gnu) built on its own:
# tools/build-live-module.sh (docs/analysis/live-link.md).
exclude = ["fuzz", "crates/doctor-toolkit-live-asi"]

[workspace.package]
version = "0.0.2"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-only"
repository = "https://github.com/Darkildo/doctor_toolkit"

[workspace.dependencies]
doctor-toolkit = { path = "crates/doctor-toolkit" }
doctor-toolkit-live = { path = "crates/doctor-toolkit-live" }
doctor-toolkit-mcp = { path = "crates/doctor-toolkit-mcp" }
doctor-toolkit-mods = { path = "crates/doctor-toolkit-mods" }
anyhow = "1"
binrw = "0.15"
clap = { version = "4.6", features = ["derive"] }
memmap2 = "0.9"
rayon = "1"
thiserror = "2"

[profile.dev]
opt-level = 1

[profile.release]
debug = "line-tables-only"

# Binaries for releases (`tools/release.sh`): smaller and a little faster,
# slower to build.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1
debug = false
strip = true
