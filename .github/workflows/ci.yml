name: CI

# Checks of every change, kept short to spend few runner minutes: one Linux
# job (format, lints, tests) and the Python bindings. Packages for Linux,
# Windows and macOS are built only for a release tag (release.yml); the
# fuzzers run weekly (fuzz.yml). Changes of documentation alone run only the
# checks of the knowledge base (kb.yml).

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - "tools/screenshots.sh"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - "tools/screenshots.sh"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Faster from-scratch builds and a smaller cache: no incremental state, no
  # debug information in test binaries.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt, clippy, tests (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - uses: Swatinem/rust-cache@v2
        with:
          # Pull requests read the cache of main but do not add their own.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libasound2-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The editor plays sound by default (`audio`, ALSA); the build without
      # it is only linted, not tested again.
      - run: cargo clippy -p doctor-toolkit-gui --all-targets --no-default-features -- -D warnings
      # Corpus tests need the game files (EARS_GF2_DIR) and skip themselves here.
      - run: cargo test --workspace
      # The knowledge base docs/kb: every note passes the lint and the
      # generated notes match data/gf2 (the tests above check the same; these
      # print the list). Changes of documentation alone are checked by kb.yml.
      - name: Check the knowledge base
        run: |
          cargo run -p doctor-toolkit-cli -- kb-lint
          cargo run -p doctor-toolkit-cli -- kb-gen --check
      # docs/parity.md is written from data/toolkit/capabilities.toml (the
      # tests above check the same and that the table has every MCP tool,
      # editor command and command of the command line).
      - name: Check the table of capabilities
        run: cargo run -p doctor-toolkit-cli -- parity-gen --check
      - name: Check the release scripts
        run: bash -n tools/release.sh && bash -n tools/package.sh

  python:
    name: Python bindings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      # Builds the abi3 module (debug: compiles much faster than --release)
      # into a virtualenv and runs the pytest suite (synthetic game; the
      # corpus tests skip themselves without EARS_GF2_DIR).
      - name: Python bindings
        working-directory: crates/doctor-toolkit-py
        run: |
          python -m venv .venv
          .venv/bin/pip install "maturin>=1.9.4,<2" pytest
          VIRTUAL_ENV=$PWD/.venv .venv/bin/maturin develop
          .venv/bin/python -m pytest -q
