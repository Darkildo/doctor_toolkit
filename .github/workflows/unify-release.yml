name: Release of gf2-unify

# The program of the unified game (crates/doctor-toolkit-unify) is released
# apart from the toolkit: a tag `gf2-unify-v<version>` (the version of the
# Cargo.toml of the crate) builds it for Windows x86_64 and Linux x86_64 and
# puts the archives on a draft release. The pack with game data is not here:
# the program names where it is shared.

on:
  push:
    tags: ["gf2-unify-v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_DEBUG: 0
  CARGO_PROFILE_RELEASE_STRIP: symbols

permissions:
  contents: write

concurrency:
  group: unify-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { name: Windows x86_64, os: windows-latest, suffix: windows-x86_64 }
          # An older system: the program then runs on a glibc from 2.35 on.
          - { name: Linux x86_64, os: ubuntu-22.04, suffix: linux-x86_64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: The version, checked against the tag
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/doctor-toolkit-unify/Cargo.toml | head -n1)
          if [[ $GITHUB_REF == refs/tags/gf2-unify-v* ]]; then
            test "gf2-unify-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p doctor-toolkit-unify
      - run: cargo build --release -p doctor-toolkit-unify
      - name: Package
        run: |
          name=gf2-unify-$VERSION-${{ matrix.suffix }}
          mkdir -p "dist/$name"
          cp crates/doctor-toolkit-unify/README.txt LICENSE* "dist/$name/"
          cd dist
          if [[ $RUNNER_OS == Windows ]]; then
            cp ../target/release/gf2-unify.exe "$name/"
            7z a -tzip "$name.zip" "$name" >/dev/null
            sha256sum "$name.zip" > "$name.zip.sha256"
          else
            cp ../target/release/gf2-unify "$name/"
            tar -czf "$name.tar.gz" "$name"
            sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          fi
          rm -r "$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suffix }}
          path: dist/*

  publish:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/gf2-unify-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --latest=false \
            --title "gf2-unify ${GITHUB_REF_NAME#gf2-unify-v}" \
            --notes "The program of the unified game of The Godfather II for Windows x86_64 and Linux x86_64. See README.txt in the archive and docs/unified-game.md (Russian)."
