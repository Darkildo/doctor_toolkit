[package]
name = "doctor-toolkit-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "GPL-3.0-only"

[package.metadata]
cargo-fuzz = true

# Kept out of the main workspace: it needs a nightly toolchain and cargo-fuzz.
[workspace]
members = ["."]

[lib]
name = "doctor_toolkit_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4"
doctor-toolkit = { path = "../crates/doctor-toolkit" }
serde_json = "1"

[profile.release]
debug = 1

[[bin]]
name = "ustream"
path = "fuzz_targets/ustream.rs"
test = false
doc = false
bench = false

